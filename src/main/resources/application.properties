# ===================================================================
# RoomBook Application Configuration (Default / Production)
# ===================================================================
spring.application.name=roombook

# --- 1. БД: roombook_app (D-20, SEC-16: пароль без значення за замовчуванням) ---
spring.datasource.url=${ROOMBOOK_DB_URL}
spring.datasource.username=${ROOMBOOK_DB_USERNAME}
spring.datasource.password=${ROOMBOOK_DB_PASSWORD}

# --- 1. БД: roombook_owner для міграцій Flyway (D-20, SEC-16) ---
spring.flyway.enabled=true
spring.flyway.url=${ROOMBOOK_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${ROOMBOOK_FLYWAY_USERNAME}
spring.flyway.password=${ROOMBOOK_FLYWAY_PASSWORD}

# --- 2. Пул з'єднань HikariCP ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# --- 3. Бізнес-параметри (Етап 2, D-01, TR-01..TR-04, INV-03..INV-05) ---
roombook.business.office-zone=Europe/Kyiv
roombook.business.work-day-start=08:00
roombook.business.work-day-end=20:00
roombook.business.slot-grid=15m
roombook.business.min-duration=15m
roombook.business.max-duration=4h
roombook.business.horizon-days=90

# --- 4. Безпека (D-15, D-18, R-12) ---
roombook.security.password-hash-cost=12
server.servlet.session.timeout=15m
roombook.security.authenticated-session-timeout=8h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# --- 5. Bootstrap першого ADMIN (D-22, SEC-16) ---
roombook.bootstrap.admin-username=${ROOMBOOK_ADMIN_USERNAME:}
roombook.bootstrap.admin-password=${ROOMBOOK_ADMIN_PASSWORD:}

# --- 6. Мережа (D-21) ---
server.port=8080
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.forward-headers-strategy=framework

# --- 7. Журнали (D-19: json/ecs у prod, INFO) ---
logging.level.root=INFO
logging.level.roombook=INFO
logging.structured.format.console=ecs

# --- 8. JPA / Hibernate / Jackson (AR-10, D-11) ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.default-leniency=false

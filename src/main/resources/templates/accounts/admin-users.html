<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: page('Користувачі', ~{::page-content})}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Користувачі: Переговорні</title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/fonts.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/timeline.css}">
  <script th:src="@{/js/htmx.min.js}"></script>
  <script th:src="@{/js/htmx-swap.js}"></script>
</head>
<body>
  <section th:fragment="page-content">
    <div class="page-head">
      <h1>Користувачі</h1>
      <div class="form-actions"><a class="btn btn-primary" th:href="@{/admin/invitations}">Запросити працівника</a><a class="btn" th:href="@{/admin/users/new}">Додати користувача</a></div>
    </div>
    

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Ім'я</th>
            <th scope="col">Логін</th>
            <th scope="col">Роль</th>
            <th scope="col">Стан</th>
            <th scope="col"><span class="sr-only">Дія</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${users.empty}">
            <td colspan="5" class="cell-empty">Користувачів немає.</td>
          </tr>
          <th:block th:each="user : ${users}"><tr th:replace="~{components/user-row :: row}"></tr></th:block>
        </tbody>
      </table>
    </div>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: page('Новий користувач', ~{::page-content})}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новий користувач: Переговорні</title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/fonts.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/timeline.css}">
  <script th:src="@{/js/htmx.min.js}"></script>
  <script th:src="@{/js/htmx-swap.js}"></script>
</head>
<body>
  <section th:fragment="page-content">
    <div class="page-head">
      <h1>Новий користувач</h1>
    </div>
    

    <form th:fragment="form" id="user-form" class="form-stack" th:action="@{/admin/users}" method="post" hx-post="/admin/users" hx-target="#user-form" hx-swap="outerHTML" hx-disabled-elt="button">
      <div th:replace="~{components/field-error :: summary}"></div>
      <div class="field" th:classappend="${fieldErrors != null and fieldErrors['username'] != null ? 'field-error' : ''}">
        <label class="field-label" for="user-login">Логін</label>
        <input class="field-control" id="user-login" name="username" type="text" autocomplete="off" required
               th:value="${user.username}"
               th:attr="aria-invalid=${fieldErrors != null and fieldErrors['username'] != null ? 'true' : null},aria-describedby=${fieldErrors != null and fieldErrors['username'] != null ? 'user-login-error' : null}">
        <span th:if="${fieldErrors != null and fieldErrors['username'] != null}"
              th:replace="~{components/field-error :: message('username')}"></span>
      </div>

      <div class="field" th:classappend="${fieldErrors != null and fieldErrors['displayName'] != null ? 'field-error' : ''}">
        <label class="field-label" for="user-name">Ім'я</label>
        <input class="field-control" id="user-name" name="displayName" type="text" autocomplete="off" required
               th:value="${user.displayName}"
               th:attr="aria-invalid=${fieldErrors != null and fieldErrors['displayName'] != null ? 'true' : null},aria-describedby=${fieldErrors != null and fieldErrors['displayName'] != null ? 'user-name-error' : null}">
        <span th:if="${fieldErrors != null and fieldErrors['displayName'] != null}"
              th:replace="~{components/field-error :: message('displayName')}"></span>
      </div>

      <div class="field" th:classappend="${fieldErrors != null and fieldErrors['role'] != null ? 'field-error' : ''}">
        <label class="field-label" for="user-role">Роль</label>
        <select class="field-control" id="user-role" name="role" required
                th:attr="aria-invalid=${fieldErrors != null and fieldErrors['role'] != null ? 'true' : null},aria-describedby=${fieldErrors != null and fieldErrors['role'] != null ? 'user-role-error' : null}">
          <option value="EMPLOYEE" th:selected="${user.role == 'EMPLOYEE'}">Працівник</option>
          <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Адміністратор</option>
        </select>
        <span th:if="${fieldErrors != null and fieldErrors['role'] != null}"
              th:replace="~{components/field-error :: message('role')}"></span>
      </div>

      <div class="field" th:classappend="${fieldErrors != null and fieldErrors['password'] != null ? 'field-error' : ''}">
        <label class="field-label" for="user-password">Пароль</label>
        <input class="field-control" id="user-password" name="password" type="password" autocomplete="new-password" minlength="10" required
               th:attr="aria-describedby=${fieldErrors != null and fieldErrors['password'] != null ? 'user-password-error password-hint' : 'password-hint'},aria-invalid=${fieldErrors != null and fieldErrors['password'] != null ? 'true' : null}">
        <span class="field-hint" id="password-hint">Від 10 символів.</span>
        <span th:if="${fieldErrors != null and fieldErrors['password'] != null}"
              th:replace="~{components/field-error :: message('password')}"></span>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Створити користувача</button>
      </div>
    </form>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: page(${user.displayName}, ~{::page-content})}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${user.displayName} + ': Переговорні'"></title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/fonts.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/timeline.css}">
  <script th:src="@{/js/htmx.min.js}"></script>
  <script th:src="@{/js/htmx-swap.js}"></script>
</head>
<body>
  <section th:fragment="page-content">
    <div class="page-head">
      <h1 th:text="${user.displayName}"></h1>
    </div>
    

    <div th:fragment="panel" id="user-panel">
      <section class="form-section" aria-labelledby="role-title">
        <h2 id="role-title">Змінити роль</h2>
        <form id="role-form" class="form-stack" th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post"
              th:hx-post="@{/admin/users/{id}/role(id=${user.id})}" hx-target="#user-panel" hx-swap="outerHTML" hx-disabled-elt="button">
          <div class="field">
            <label class="field-label" for="user-role">Роль</label>
            <select class="field-control" id="user-role" name="role" required>
              <option value="EMPLOYEE" th:selected="${roleForm.role == 'EMPLOYEE'}">Працівник</option>
              <option value="ADMIN" th:selected="${roleForm.role == 'ADMIN'}">Адміністратор</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Зберегти роль</button>
          </div>
        </form>
      </section>

      <section class="form-section" aria-labelledby="password-title">
        <h2 id="password-title">Скинути пароль</h2>
        <div th:replace="~{accounts/admin-user-password-form :: form}"></div>
      </section>
    </div>
  </section>
</body>
</html>

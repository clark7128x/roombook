<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="form" id="password-form" class="form-stack" th:action="@{/admin/users/{id}/password(id=${userId})}" method="post"
      th:hx-post="@{/admin/users/{id}/password(id=${userId})}" hx-target="#password-form" hx-swap="outerHTML" hx-disabled-elt="button">
      <div th:replace="~{components/field-error :: summary}"></div>
  <div th:if="${success != null}" class="alert alert-success" role="status">
    <svg class="message-icon" aria-hidden="true"><use th:href="@{/icons.svg#ok}"></use></svg>
    <span th:text="${success}"></span>
  </div>
  <div class="field" th:classappend="${fieldErrors != null and fieldErrors['password'] != null ? 'field-error' : ''}">
    <label class="field-label" for="user-password">Пароль</label>
    <input class="field-control" id="user-password" name="password" type="password" autocomplete="new-password" minlength="10" required
           th:attr="aria-describedby=${fieldErrors != null and fieldErrors['password'] != null ? 'user-password-error password-hint' : 'password-hint'},aria-invalid=${fieldErrors != null and fieldErrors['password'] != null ? 'true' : null}">
    <span class="field-hint" id="password-hint">Від 10 символів.</span>
    <span th:if="${fieldErrors != null and fieldErrors['password'] != null}"
          th:replace="~{components/field-error :: message('password')}"></span>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Задати новий пароль</button>
  </div>
</form>
</body>
</html>

<div xmlns:th="http://www.thymeleaf.org" th:fragment="timeline" class="timeline-scroll" tabindex="0" aria-label="Розклад з горизонтальним прокручуванням">
<table class="horizontal-table"><caption th:text="'Зайнятість кімнат на ' + ${@uiFormat.date(date)}"></caption><colgroup><col class="room-col"><col th:span="${horizontal.slots}"></colgroup>
<thead><tr><th scope="col">Кімната / час</th><th scope="colgroup" th:each="hour : ${horizontal.hours}" th:colspan="${hour.span}" th:text="${hour.time}"></th></tr></thead>
<tbody><tr th:each="roomRow : ${horizontal.rooms}"><th class="room-info" scope="row"><span class="room-name" th:text="${roomRow.room.name}"></span><span class="room-meta" th:text="${roomRow.room.floor} + ' поверх, до ' + ${roomRow.room.capacity} + ' людей'"></span><span class="room-equipment" th:text="${roomRow.room.equipment}"></span><a th:if="${timeline.bookableDate}" th:href="@{/bookings/new(roomId=${roomRow.room.id},date=${date})}">Забронювати</a></th>
<td th:each="block : ${roomRow.blocks}" th:colspan="${block.span}" th:class="${(block.past ? 'h-past ' : '') + (block.now ? 'h-now' : '')}">
<a class="free-link" th:if="${block.cell.free and block.cell.link}" th:href="@{/bookings/new(roomId=${roomRow.room.id},date=${date},start=${block.time})}" th:attr="aria-label='Забронювати ' + ${roomRow.room.name} + ', з ' + ${block.time}"><span th:if="${block.span >= 4}">Вільно</span><span th:if="${block.span < 4}" aria-hidden="true">+</span></a>
<div th:if="${!block.cell.free}" class="h-booking" th:classappend="${(block.cell.mine ? 'mine ' : '') + (freshBookingId != null and freshBookingId == block.cell.bookingId ? 'fresh' : '')}" th:title="${block.cell.tooltip}" tabindex="0"><strong th:text="${block.cell.title}"></strong><small th:text="${block.cell.interval}"></small><small th:if="${block.cell.mine}">Ваше бронювання</small><small class="author" th:text="${block.cell.author}"></small></div>
</td></tr></tbody></table></div>

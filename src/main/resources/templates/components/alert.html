<div xmlns:th="http://www.thymeleaf.org" th:fragment="alert" class="alert alert-error" role="alert">
    <svg aria-hidden="true" focusable="false"><use th:href="@{/icons.svg#error}"></use></svg>
    <div class="alert-text"><span th:text="${message}"></span><span th:if="${status == 500}"> Код запиту: <span th:text="${requestId}"></span>.</span></div>
</div>

<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ': RoomBook'">RoomBook</title>
    <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false}'>
    <link rel="stylesheet" th:href="@{/css/tokens.css}"><link rel="stylesheet" th:href="@{/css/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/timeline.css}">
    <link rel="stylesheet" th:href="@{/css/refresh.css(v=4)}">
    <script th:src="@{/js/htmx.min.js}" defer></script><script th:src="@{/js/htmx-swap.js}" defer></script>
    <script th:src="@{/js/ui.js}" defer></script>
</head>
<body class="app-page" th:attr="hx-headers=${csrfHeaders}">
<a class="skip-link" href="#main">До змісту</a>
<aside class="sidebar">
    <a class="brand" th:href="@{/occupancy}"><span class="brand-mark" aria-hidden="true">r<span>·</span></span>RoomBook</a>
    <div class="workspace"><span class="workspace-icon" aria-hidden="true">R</span><div><strong>Ваш офіс</strong><small>Простір команди</small></div></div>
    <nav th:if="${currentUser != null}" class="app-nav" aria-label="Основна навігація">
        <a class="nav-link" th:href="@{/occupancy}" th:attr="aria-current=${currentPath == '/occupancy' ? 'page' : null}">Зайнятість</a>
        <a class="nav-link" th:href="@{/rooms}" th:attr="aria-current=${currentPath == '/rooms' ? 'page' : null}">Кімнати</a>
        <a class="nav-link" th:href="@{/bookings/mine}" th:attr="aria-current=${currentPath == '/bookings/mine' ? 'page' : null}">Мої бронювання</a>
        <span th:if="${isAdmin}" class="nav-admin">
            <a class="nav-link" th:href="@{/admin/bookings}">Усі бронювання</a>
            <a class="nav-link" th:href="@{/admin/rooms}">Керування кімнатами</a>
            <a class="nav-link" th:href="@{/admin/users}">Користувачі</a>
            <a class="nav-link" th:href="@{/admin/invitations}">Запрошення</a>
        </span>
    </nav>
    <div class="sidebar-note"><strong>Усе на одному розкладі</strong><p>Оберіть кімнату та час для наступної зустрічі.</p></div>
    <div class="profile" th:if="${currentUser != null}">
        <div><strong class="app-user-name" th:text="${currentUser.displayName}"></strong><small th:text="${isAdmin ? 'Адміністратор' : 'Працівник'}"></small></div>
        <form th:action="@{/logout}" method="post"><button class="btn" type="submit">Вийти</button></form>
    </div>
</aside>
<div class="app-main"><header class="topbar"><span>Робочий простір <span class="crumb">/</span><strong th:text="${title}"></strong></span><span>RoomBook</span></header>
<main id="main" class="page-shell">
    <div id="alerts" class="alerts" aria-live="polite"><div th:if="${successMessage != null}" class="alert alert-success" role="status"><svg aria-hidden="true" focusable="false"><use th:href="@{/icons.svg#ok}"></use></svg><span class="alert-text" th:text="${successMessage}"></span></div></div>
    <th:block th:replace="${content}"></th:block>
</main>
</div>
</body>
</html>

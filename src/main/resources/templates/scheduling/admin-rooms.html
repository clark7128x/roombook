<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: page('Керування кімнатами', ~{::page-content})}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Керування кімнатами: Переговорні</title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/fonts.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/timeline.css}">
  <script th:src="@{/js/htmx.min.js}"></script>
  <script th:src="@{/js/htmx-swap.js}"></script>
</head>
<body>
  <section th:fragment="page-content">
    <div class="page-head">
      <h1>Керування кімнатами</h1>
      <a class="btn btn-primary" th:href="@{/admin/rooms/new}">Додати кімнату</a>
    </div>
    

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Назва</th>
            <th scope="col">Поверх</th>
            <th scope="col">Місткість</th>
            <th scope="col">Обладнання</th>
            <th scope="col">Стан</th>
            <th scope="col"><span class="sr-only">Дії</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${rooms.empty}">
            <td colspan="6" class="cell-empty">Кімнат немає.</td>
          </tr>
          <th:block th:each="room : ${rooms}">
            <tr th:replace="~{components/room-row :: row}"></tr>
          </th:block>
        </tbody>
      </table>
    </div>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: page('Усі бронювання', ~{::page-content})}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Усі бронювання: Переговорні</title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/fonts.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/timeline.css}">
  <script th:src="@{/js/htmx.min.js}"></script>
  <script th:src="@{/js/htmx-swap.js}"></script>
</head>
<body>
  <section th:fragment="page-content">
    <div class="page-head">
      <h1>Усі бронювання</h1>
    </div>
    

    <form class="filters" action="#" th:action="@{/admin/bookings}" method="get">
      <div class="field filter-field">
        <label class="field-label" for="room">Кімната</label>
        <select class="field-control" id="room" name="roomId">
          <option value="" th:selected="${roomId == null}">Усі</option>
          <option th:each="room : ${rooms}"
                  th:value="${room.id}"
                  th:text="${room.name}"
                  th:selected="${roomId != null and roomId == room.id}"></option>
        </select>
      </div>
      <div class="field filter-field">
        <label class="field-label" for="author">Автор</label>
        <select class="field-control" id="author" name="authorId">
          <option value="" th:selected="${authorId == null}">Усі</option>
          <option th:each="user : ${users}"
                  th:value="${user.id}"
                  th:text="${user.displayName}"
                  th:selected="${authorId != null and authorId == user.id}"></option>
        </select>
      </div>
      <div class="field filter-field">
        <label class="field-label" for="date-from">З дати</label>
        <input class="field-control" id="date-from" name="dateFrom" type="date" th:value="${dateFrom}">
      </div>
      <div class="field filter-field">
        <label class="field-label" for="date-to">До дати</label>
        <input class="field-control" id="date-to" name="dateTo" type="date" th:value="${dateTo}">
      </div>
      <div class="field filter-field">
        <label class="field-label" for="status">Стан</label>
        <select class="field-control" id="status" name="status">
          <option value="" th:selected="${status == null or status == ''}">Усі</option>
          <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Активні</option>
          <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Скасовано</option>
        </select>
      </div>
      <div class="field filter-field">
        <label class="field-label" for="order">Порядок</label>
        <select class="field-control" id="order" name="order">
          <option value="desc" th:selected="${order == 'desc'}">Спочатку нові</option>
          <option value="asc" th:selected="${order == 'asc'}">Спочатку старі</option>
        </select>
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" type="submit">Показати</button>
      </div>
    </form>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Дата</th>
            <th scope="col">Час</th>
            <th scope="col">Кімната</th>
            <th scope="col">Назва</th>
            <th scope="col">Автор</th>
            <th scope="col">Стан</th>
            <th scope="col"><span class="sr-only">Дія</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${page.items.empty}">
            <td colspan="7" class="cell-empty">Бронювань немає.</td>
          </tr>
          <th:block th:each="booking : ${page.items}">
            <tr th:replace="~{components/booking-row :: row}"></tr>
          </th:block>
        </tbody>
      </table>
    </div>

    <nav th:if="${!page.items.empty}" class="pager" aria-label="Сторінки бронювань">
      <span th:if="${page.page == 0}" class="pager-disabled" aria-disabled="true">Попередня сторінка</span>
      <a th:if="${page.page > 0}"
         th:href="@{/admin/bookings(roomId=${roomId},authorId=${authorId},dateFrom=${dateFrom},dateTo=${dateTo},status=${status},order=${order},page=${page.page - 1},size=${page.size})}">Попередня сторінка</a>
      <span class="pager-current" aria-current="page" th:text="'Сторінка ' + ${page.page + 1}"></span>
      <a th:if="${page.hasNext}"
         th:href="@{/admin/bookings(roomId=${roomId},authorId=${authorId},dateFrom=${dateFrom},dateTo=${dateTo},status=${status},order=${order},page=${page.page + 1},size=${page.size})}">Наступна сторінка</a>
      <span th:if="${!page.hasNext}" class="pager-disabled" aria-disabled="true">Наступна сторінка</span>
    </nav>
  </section>
</body>
</html>

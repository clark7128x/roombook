<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: page('Мої бронювання', ~{::page-content})}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мої бронювання: Переговорні</title>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/fonts.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/timeline.css}">
  <script th:src="@{/js/htmx.min.js}"></script>
  <script th:src="@{/js/htmx-swap.js}"></script>
</head>
<body>
  <section th:fragment="page-content">
    <div class="page-head">
      <h1>Мої бронювання</h1>
    </div>
    

    <nav class="tabs" aria-label="Період бронювань">
      <a class="tab" th:href="@{/bookings/mine(tab=upcoming)}" th:aria-current="${tab == 'upcoming' ? 'page' : null}">Сьогодні й далі</a>
      <a class="tab" th:href="@{/bookings/mine(tab=past)}" th:aria-current="${tab == 'past' ? 'page' : null}">Раніше</a>
    </nav>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Дата</th>
            <th scope="col">Час</th>
            <th scope="col">Кімната</th>
            <th scope="col">Назва</th>
            <th scope="col">Стан</th>
            <th scope="col"><span class="sr-only">Дія</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${page.items.empty}">
            <td colspan="6" class="cell-empty">Бронювань немає. Створіть перше на сторінці <a th:href="@{/occupancy}">«Зайнятість»</a>.</td>
          </tr>
          <tr th:each="booking : ${page.items}" th:id="'booking-' + ${booking.id}">
            <td th:replace="~{components/booking-row :: row-inner}"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav th:if="${!page.items.empty}" class="pager" aria-label="Сторінки бронювань">
      <span th:if="${page.page == 0}" class="pager-disabled" aria-disabled="true">Попередня сторінка</span>
      <a th:if="${page.page > 0}" th:href="@{/bookings/mine(tab=${tab},page=${page.page - 1},size=${page.size})}">Попередня сторінка</a>
      <span class="pager-current" aria-current="page" th:text="'Сторінка ' + ${page.page + 1}"></span>
      <a th:if="${page.hasNext}" th:href="@{/bookings/mine(tab=${tab},page=${page.page + 1},size=${page.size})}">Наступна сторінка</a>
      <span th:if="${!page.hasNext}" class="pager-disabled" aria-disabled="true">Наступна сторінка</span>
    </nav>
  </section>
</body>
</html>

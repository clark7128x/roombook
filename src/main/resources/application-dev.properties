# ===================================================================
# Dev profile overrides (Локальна розробка)
# ===================================================================

# Локальна БД (PostgreSQL 16 у контейнері за D-20)
spring.datasource.url=jdbc:postgresql://localhost:5432/roombook
spring.datasource.username=roombook_app
spring.datasource.password=app_pass

spring.flyway.url=jdbc:postgresql://localhost:5432/roombook
spring.flyway.user=roombook_owner
spring.flyway.password=owner_pass

# Локальний bootstrap адміністратора для dev
roombook.bootstrap.admin-username=admin
roombook.bootstrap.admin-password=AdminSecret123!

# Послаблення dev за таблицею «Конфігурація й середовища»:
# 1. cookie Secure = false
server.servlet.session.cookie.secure=false

# 2. Формат журналу = text (plain console log)
logging.structured.format.console=

# 3. Вартість bcrypt = 4
roombook.security.password-hash-cost=4

# 4. Журнал SQL = увімкнено
spring.jpa.show-sql=true

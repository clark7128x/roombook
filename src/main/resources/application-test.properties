# Прискорений хеш bcrypt для тестів
roombook.security.password-hash-cost=4

# Тестове середовище без HTTPS
server.servlet.session.cookie.secure=false

# Текстовий формат журналу
logging.structured.format.console=
spring.jpa.show-sql=false

# Bootstrap облікові дані за замовчуванням для контексту автотестів (D-22)
roombook.bootstrap.admin-username=bootstrap.admin
roombook.bootstrap.admin-password=bootstrapPassword123

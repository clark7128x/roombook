name: Verify RoomBook
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - run: python3 ops/backup/test_failure.py
      - run: python3 ops/monitoring/test_rules.py
      - run: python3 ops/audit/coverage.py
      - run: git diff --exit-code -- docs/coverage-evidence.md
      - run: mvn -B -DskipTests package
      - run: docker build -t roombook:verify .
      - run: python3 ops/container/smoke.py
